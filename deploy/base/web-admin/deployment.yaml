---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-admin-config
  labels:
    app.kubernetes.io/name: web-admin
    app.kubernetes.io/part-of: moodbot
data:
  SERVER_PORT: "8080"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  ANSWERS_URL: "http://answers"
  ANALYTICS_URL: "http://analytics"
  RECOMMENDER_URL: "http://recommender"
  # Сессия на неделю. Дольше — неудобно отзывать, короче — человек
  # будет каждый раз просить у бота новую ссылку.
  SESSION_TTL: "168h"
  SECURE_COOKIE: "true"
  # Таймаут к соседям меньше, чем таймаут ingress к нам (15с):
  # иначе ingress оборвёт соединение раньше, чем мы успеем отдать
  # частично собранную страницу, и деградация не сработает.
  HTTP_TIMEOUT: "4s"
  HTTP_RETRIES: "1"
  SHUTDOWN_TIMEOUT: "15s"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-admin
  labels:
    app.kubernetes.io/name: web-admin
    app.kubernetes.io/part-of: moodbot
    app.kubernetes.io/component: web
spec:
  # Две реплики: это единственный сервис, который видит пользователь,
  # и единственный, чья недоступность заметна снаружи немедленно.
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: web-admin
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
      labels:
        app.kubernetes.io/name: web-admin
        app.kubernetes.io/part-of: moodbot
        app.kubernetes.io/component: web
    spec:
      terminationGracePeriodSeconds: 30
      # СВОЙ ServiceAccount вместо default — и отключённое монтирование
      # его токена.
      #
      # ЗАЧЕМ СВОЙ SA: он нужен Vault. Роль в Vault привязана к паре
      # (имя SA, namespace), и именно этим сервис доказывает свою
      # личность. С общим `default` все сервисы были бы одной личностью,
      # и политики по путям потеряли бы смысл.
      #
      # ЗАЧЕМ automountServiceAccountToken: false: по умолчанию Kubernetes
      # кладёт токен SA в КАЖДЫЙ под по пути
      # /var/run/secrets/kubernetes.io/serviceaccount/token. Выполнение
      # кода в контейнере даёт этот токен, а с ним — обращения к API
      # кластера. Наши сервисы к API не обращаются вообще, значит токен
      # им не нужен и монтировать его незачем.
      #
      # Vault от этого НЕ ломается: Vault Secrets Operator получает токен
      # через TokenRequest API от имени SA, а не читает его из пода.
      # Проверено — ротация секретов продолжает работать.
      serviceAccountName: web-admin
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: web-admin
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web-admin
          image: ghcr.io/ivanvnew75/web-admin:0.3.1@sha256:e7b2c87aa71b58419d10e436749c5280230f0ebdd50f380f6075efa87002e686
          imagePullPolicy: IfNotPresent   # digest подставит Kyverno, тянем из GHCR
          ports:
            - name: http
              containerPort: 8080
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          envFrom:
            - configMapRef:
                name: web-admin-config
          env:
            - name: LINK_SECRET
              valueFrom:
                secretKeyRef:
                  # ТОТ ЖЕ Secret, что у telegram-api. Бот подписывает
                  # ссылку, кабинет проверяет подпись — ключ обязан
                  # совпадать, и держать его в одном месте надёжнее,
                  # чем в двух синхронизируемых вручную.
                  name: moodbot-link
                  key: link-secret
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: web-admin
  labels:
    app.kubernetes.io/name: web-admin
    app.kubernetes.io/part-of: moodbot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web-admin
  ports:
    - name: http
      port: 80
      targetPort: http
