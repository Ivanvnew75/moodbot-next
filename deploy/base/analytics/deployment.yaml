---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  labels:
    app.kubernetes.io/name: analytics
    app.kubernetes.io/part-of: moodbot
    app.kubernetes.io/component: consumer
spec:
  # ОДНА реплика, в отличие от answers (две).
  #
  # Разница не случайна. answers — источник истины, его недоступность
  # означает потерю ответа пользователя, поэтому две реплики.
  # analytics — производное хранилище: если он полежит, графики отстанут,
  # а данные никуда не денутся (они в Kafka). Вторая реплика здесь
  # покупала бы доступность графиков ценой лишнего пода и лишних
  # соединений к ClickHouse, который к многим соединениям не расположен.
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
      labels:
        app.kubernetes.io/name: analytics
        app.kubernetes.io/part-of: moodbot
        app.kubernetes.io/component: consumer
    spec:
      terminationGracePeriodSeconds: 30
      # СВОЙ ServiceAccount вместо default — и отключённое монтирование
      # его токена.
      #
      # ЗАЧЕМ СВОЙ SA: он нужен Vault. Роль в Vault привязана к паре
      # (имя SA, namespace), и именно этим сервис доказывает свою
      # личность. С общим `default` все сервисы были бы одной личностью,
      # и политики по путям потеряли бы смысл.
      #
      # ЗАЧЕМ automountServiceAccountToken: false: по умолчанию Kubernetes
      # кладёт токен SA в КАЖДЫЙ под по пути
      # /var/run/secrets/kubernetes.io/serviceaccount/token. Выполнение
      # кода в контейнере даёт этот токен, а с ним — обращения к API
      # кластера. Наши сервисы к API не обращаются вообще, значит токен
      # им не нужен и монтировать его незачем.
      #
      # Vault от этого НЕ ломается: Vault Secrets Operator получает токен
      # через TokenRequest API от имени SA, а не читает его из пода.
      # Проверено — ротация секретов продолжает работать.
      serviceAccountName: analytics
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: analytics
          image: ghcr.io/ivanvnew75/analytics:0.4.0@sha256:6b1ab09d0c43d177b9f6f46e777f8750df483a8df98d3ff2027f35f30429d2e5
          imagePullPolicy: IfNotPresent   # digest подставит Kyverno, тянем из GHCR
          ports:
            - name: http
              containerPort: 8080
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          envFrom:
            - configMapRef:
                name: analytics-config
          env:
            - name: KAFKA_USER
              value: analytics
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: analytics
                  key: password
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-analytics
                  key: password
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: analytics
  labels:
    app.kubernetes.io/name: analytics
    app.kubernetes.io/part-of: moodbot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: analytics
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Схема ClickHouse — Job из того же образа.
#
# В отличие от PostgreSQL здесь нет транзакционного DDL и нет учёта
# версий: DDL идемпотентен (IF NOT EXISTS) и безопасен к повтору.
# Разбор компромисса — в services/analytics/schema.go.
apiVersion: batch/v1
kind: Job
metadata:
  name: analytics-schema-v0-2-0
  labels:
    app.kubernetes.io/name: analytics
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics
        app.kubernetes.io/component: migration
        # part-of ЯВНО, а не через kustomize.
        #
        # Трансформер labels в kustomize добавляет метки в metadata
        # объекта, но НЕ в шаблон пода (для этого есть отдельный
        # includeTemplates). В результате под Job'а оказался без метки
        # приложения, и NetworkPolicy отрезала его от ClickHouse:
        # «ping clickhouse: i/o timeout» на пустом месте.
        #
        # Короткоживущие Job — первое, что забывают при внедрении
        # default-deny: их нет в списке сервисов, они не висят в get pods,
        # и ломаются они молча, при следующей выкатке схемы.
        app.kubernetes.io/part-of: moodbot
    spec:
      restartPolicy: Never
      serviceAccountName: analytics
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: schema
          image: ghcr.io/ivanvnew75/analytics:0.4.0@sha256:6b1ab09d0c43d177b9f6f46e777f8750df483a8df98d3ff2027f35f30429d2e5
          imagePullPolicy: IfNotPresent   # digest подставит Kyverno, тянем из GHCR
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: analytics-config
          env:
            - name: KAFKA_USER
              value: analytics
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: analytics
                  key: password
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-analytics
                  key: password
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
