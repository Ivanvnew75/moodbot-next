---
apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-config
  labels:
    app.kubernetes.io/name: analytics
    app.kubernetes.io/part-of: moodbot
data:
  SERVER_PORT: "8080"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  KAFKA_BROKERS: "moodbot-kafka-kafka-bootstrap:9093"
  # СВОЯ consumer group, отличная от answers-writer.
  # Именно разные группы дают fan-out: каждый потребитель ведёт
  # собственный offset и читает ВСЕ сообщения топика. Одна группа
  # на двоих означала бы, что сообщения делятся между сервисами —
  # половина ответов попала бы только в Postgres, половина только
  # в ClickHouse. Это типовая ошибка при первом знакомстве с Kafka.
  KAFKA_GROUP: "analytics-writer"
  CLICKHOUSE_ADDR: "clickhouse:9000"
  CLICKHOUSE_DB: "moodbot"
  CLICKHOUSE_USER: "analytics"
  CLICKHOUSE_TLS: "false"
  SHUTDOWN_TIMEOUT: "15s"
