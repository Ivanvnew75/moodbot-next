---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: answers
  labels:
    app.kubernetes.io/name: answers
    app.kubernetes.io/part-of: moodbot
    app.kubernetes.io/component: consumer
spec:
  # 2 реплики при 3 партициях. Consumer group раздаст партиции сама:
  # одной реплике 2, другой 1. Третья реплика получила бы третью
  # партицию, четвёртая — простаивала бы (партиций больше нет),
  # но продолжала бы обслуживать HTTP. Это и есть потолок
  # масштабирования потребителя, заданный числом партиций.
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: answers
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
      labels:
        app.kubernetes.io/name: answers
        app.kubernetes.io/part-of: moodbot
        app.kubernetes.io/component: consumer
    spec:
      # 30 секунд хватает: при SIGTERM потребитель дорабатывает текущее
      # сообщение, коммитит offset и выходит из группы. Если убить его
      # раньше, группа заметит уход только по session.timeout, и на это
      # время партиции будут простаивать.
      terminationGracePeriodSeconds: 30
      # СВОЙ ServiceAccount вместо default — и отключённое монтирование
      # его токена.
      #
      # ЗАЧЕМ СВОЙ SA: он нужен Vault. Роль в Vault привязана к паре
      # (имя SA, namespace), и именно этим сервис доказывает свою
      # личность. С общим `default` все сервисы были бы одной личностью,
      # и политики по путям потеряли бы смысл.
      #
      # ЗАЧЕМ automountServiceAccountToken: false: по умолчанию Kubernetes
      # кладёт токен SA в КАЖДЫЙ под по пути
      # /var/run/secrets/kubernetes.io/serviceaccount/token. Выполнение
      # кода в контейнере даёт этот токен, а с ним — обращения к API
      # кластера. Наши сервисы к API не обращаются вообще, значит токен
      # им не нужен и монтировать его незачем.
      #
      # Vault от этого НЕ ломается: Vault Secrets Operator получает токен
      # через TokenRequest API от имени SA, а не читает его из пода.
      # Проверено — ротация секретов продолжает работать.
      serviceAccountName: answers
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: answers
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: answers
          image: ghcr.io/ivanvnew75/answers:0.2.0@sha256:ed6a5d436464ad4ff7c29b60376305c6893fcb54f0505976b5d8ca4101e79432
          imagePullPolicy: IfNotPresent   # digest подставит Kyverno, тянем из GHCR
          ports:
            - name: http
              containerPort: 8080
          lifecycle:
            preStop:
              # Пауза перед SIGTERM: endpoints обновляются в kube-proxy
              # асинхронно, и без неё несколько запросов уже прилетят
              # в под, который начал завершаться.
              sleep:
                seconds: 5
          envFrom:
            - configMapRef:
                name: answers-config
          env:
            # Учётные данные SASL для Kafka. Secret создаёт Strimzi
            # по имени KafkaUser — пароль генерируется оператором
            # и в git не попадает вовсе.
            - name: KAFKA_USER
              value: answers
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: answers
                  key: password
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  # Свой Secret со СВОЕЙ ролью Postgres, а не users-db.
                  # См. scripts/bootstrap-answers-db.sh — роль answers
                  # физически не видит таблицы сервиса users.
                  name: answers-db
                  key: database-url
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            # Намеренно /health, а не /ready: liveness не должен зависеть
            # от Postgres. Иначе недоступность базы перезапустит все поды
            # answers, что ничем не поможет, зато устроит лавину рестартов
            # ровно в момент аварии базы.
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              # CPU-лимита нет намеренно: троттлинг Go-сервиса из-за лимита
              # даёт всплески задержек, которые ищут неделями. Request
              # гарантирует минимум, а от «съел весь узел» защищает
              # request-based scheduling и лимит памяти.
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: answers
  labels:
    app.kubernetes.io/name: answers
    app.kubernetes.io/part-of: moodbot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: answers
  ports:
    - name: http
      port: 80
      targetPort: http
