---
apiVersion: v1
kind: ConfigMap
metadata:
  name: answers-config
  labels:
    app.kubernetes.io/name: answers
    app.kubernetes.io/part-of: moodbot
data:
  SERVER_PORT: "8080"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"

  # Адрес брокера — сервис, который создаёт Strimzi.
  # Полное имя с .svc, а не короткое: короткое имя разрешается через
  # search-домены resolv.conf, и в другом namespace тот же манифест
  # молча подключился бы к чужой Kafka.
  KAFKA_BROKERS: "moodbot-kafka-kafka-bootstrap:9092"

  # Имя consumer group. Вынесено в ConfigMap не ради красоты:
  # смена имени группы — штатный способ ПЕРЕИГРАТЬ топик с начала.
  # Понадобится при восстановлении после потери базы.
  KAFKA_GROUP: "answers-writer"

  # 3 соединения на реплику × 2 реплики = 6 к Postgres.
  # Держим в уме общий max_connections=100, который делится
  # между всеми сервисами.
  DB_MAX_CONNS: "3"

  # Меньше terminationGracePeriodSeconds (30): приложение должно успеть
  # завершиться само, иначе его добьёт SIGKILL и graceful shutdown
  # окажется бесполезен.
  SHUTDOWN_TIMEOUT: "15s"
